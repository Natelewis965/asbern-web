<script>
/* =============================================================================
   watch.html — YOUR viewing, LIVE.

   ⚠ WHAT THIS PAGE CAN AND CANNOT KNOW, STATED RATHER THAN PAPERED OVER.

   The member API serves the member's OWN watch record: what they have paused,
   how long they have watched, what they have watched most, and whether anything
   is on right now. It does not serve the screening room's control surface, and
   that is a decision with a reason behind it rather than an omission:

     · WHO IS WATCHING comes from the engine's gate, never from a voice channel
       (CLAUDE.md). It is a per-viewer heartbeat on every HLS segment, and it is
       what drives accrual, resume points and the idle-stop. This page is not a
       viewer, so it is not in that count and must not claim to be.

     · `presence()` IS THREE-VALUED and the third value is load-bearing: `null`
       means the engine could not be asked, and it may never be spent as "nobody
       is watching". So `liveNow === null` renders as "we could not ask", never
       as "nothing is on".

     · A WATCH LINK IS A SINGLE-USE TICKET bound to one person and minted by the
       engine. Starting a screening, picking what plays and joining are done
       from the bot, where the room and the roster are.
   ========================================================================== */
(function () {
  'use strict';
  var M = window.MemberApp, A = window.Asbern;
  var esc = M.esc, $ = M.$;

  M.mount({ needs: ['watch'] }, function (S, ctx) {
    var host = $('[data-room]');

    if (ctx.mode === 'demo') {
      host.innerHTML =
        '<div class="as-card"><h2 class="app-sec__title u-mb-4">Your viewing needs your account</h2>' +
        '<p class="u-text-sm as-muted">What you have paused and how long you have watched are yours, so there is ' +
        'nothing to show without you.</p>' +
        '<a class="as-btn as-btn--primary u-mt-4" href="?demo=0">Sign in</a></div>';
      return;
    }

    var w = S.watch();
    if (!w) {
      host.innerHTML = '<div class="as-card"><p class="u-text-sm as-muted">Your viewing history could not be read just now.</p></div>';
      return;
    }

    var hrs = function (ms) {
      var n = Number(ms) || 0;
      if (n <= 0) return '0m';
      var mins = n / 60000;
      /* ⚠ SWITCHES UNIT BELOW AN HOUR, and that is correctness rather than
         cosmetics. A fixed `.toFixed(1)}h` rendered a real 3-minute watch as
         "0.0h" — which reads as "you watched none of it" and is
         indistinguishable from the missing-data case. */
      return mins < 60 ? Math.max(1, Math.round(mins)) + 'm' : (n / 3600000).toFixed(1) + 'h';
    };

    /* ------------------------------------------------- what is on right now */
    var liveCard;
    if (w.liveNow === true) {
      liveCard =
        '<div class="as-card as-card--frost">' +
          '<div class="as-row as-row--between">' +
            '<span class="as-badge as-badge--live"><span class="as-dot"></span> Something is on</span>' +
            '<span class="u-text-xs as-muted">Join from the bot</span>' +
          '</div>' +
          '<p class="u-text-sm u-mt-3">A screening is running. Your watch link is a <strong>single-use ticket</strong> ' +
            'bound to you and minted by the stream gate — which is also the thing that measures your time and pays you ' +
            'for it. Ask the bot for it in Discord and it will be waiting.</p>' +
        '</div>';
    } else if (w.liveNow === false) {
      liveCard =
        '<div class="as-card">' +
          '<span class="as-badge">Nothing on right now</span>' +
          '<p class="u-text-sm as-muted u-mt-3">Start something from the bot and it appears here.</p>' +
        '</div>';
    } else {
      /* ⚠ THE THIRD VALUE. `null` is "the engine could not be asked", and it is
         a different fact from "nothing is playing". Collapsing the two is
         exactly what CLAUDE.md forbids doing with presence. */
      liveCard =
        '<div class="as-card app-gate__card--bad">' +
          '<span class="as-badge as-badge--warn">Could not ask</span>' +
          '<p class="u-text-sm u-mt-3">The screening engine did not answer, so we do not know whether anything is on. ' +
            'That is not the same as nothing being on, and this page will not say it is.</p>' +
        '</div>';
    }

    /* --------------------------------------------------------------- resume */
    var resume = (w.resume || []).map(function (r) {
      return '<div class="app-collect">' +
        '<span class="app-collect__glyph">🎞️</span>' +
        '<div class="app-collect__body">' +
          '<div class="app-collect__title">' + esc(r.title || 'Something') + '</div>' +
          '<div class="app-collect__sub">' + Math.round((r.positionMs || 0) / 60000) + ' minutes in</div>' +
        '</div>' +
      '</div>';
    }).join('');

    var shows = (w.shows || []).map(function (r) {
      return '<div class="app-collect">' +
        '<span class="app-collect__glyph">📺</span>' +
        '<div class="app-collect__body">' +
          '<div class="app-collect__title">' + esc(r.showTitle || 'A series') + '</div>' +
          '<div class="app-collect__sub">S' + r.season + '·E' + r.episode + ' up next</div>' +
        '</div>' +
      '</div>';
    }).join('');

    var waiting = (w.resume || []).length + (w.shows || []).length;

    /* ----------------------------------------------------------- watch time */
    var b = w.breakdown || { totalMs: 0, splitIsComplete: false };
    var timeCard;
    if (!b.totalMs) {
      timeCard = '<p class="u-text-sm as-muted">Nothing tracked yet — watch anything and it counts.</p>';
    } else {
      /* ⚠ `splitIsComplete` GUARDS THE SPLIT. Pre-v1.4.3 rows have a total but
         no live/on-demand marker, so "0.0h live" beside a real total reads as
         "you have never watched anything live" — false, not missing. */
      timeCard =
        '<div class="app-tiles">' +
          '<div class="as-stat"><span class="as-stat__label">Total</span><span class="as-stat__value">' + esc(hrs(b.totalMs)) + '</span></div>' +
          (b.splitIsComplete
            ? '<div class="as-stat"><span class="as-stat__label">Live</span><span class="as-stat__value">' + esc(hrs(b.liveMs)) + '</span></div>' +
              '<div class="as-stat"><span class="as-stat__label">On demand</span><span class="as-stat__value">' + esc(hrs(b.totalMs - b.liveMs)) + '</span></div>'
            : '') +
        '</div>' +
        (b.splitIsComplete
          ? ''
          : '<p class="u-text-xs as-muted u-mt-3">The live / on-demand split is not shown because some of your older ' +
            'rows predate the marker that records it. Showing “0h live” there would be a claim, not a measurement.</p>');
    }

    /* ------------------------------------------------------- watched most */
    var top = (w.top || []).slice(0, 5).map(function (t) {
      /* A pre-v1.4.3 row has a play COUNT but no ms. Rendering "0.0h" there
         reads as "you watched none of it", which is false — the time was simply
         never captured. */
      var right = t.ms ? hrs(t.ms) : (t.count + ' play' + (t.count === 1 ? '' : 's'));
      return '<div class="as-row as-row--between u-text-sm" style="padding:.4rem 0;border-bottom:1px solid var(--as-border-soft)">' +
        '<span style="min-width:0">' + esc(t.title || 'Untitled') + '</span>' +
        '<span class="app-num as-muted">' + esc(right) + '</span>' +
      '</div>';
    }).join('');

    M.text('[data-room-line]', waiting
      ? waiting + (waiting === 1 ? ' thing' : ' things') + ' waiting for you'
      : 'Anything you start remembers your place');

    host.innerHTML =
      liveCard +
      '<div class="app-grid-2 u-mt-6">' +
        '<div class="app-stack" style="display:flex;flex-direction:column">' +
          '<section class="as-card" aria-labelledby="resume-h">' +
            '<div class="app-sec__head" style="margin-bottom:var(--as-space-4)">' +
              '<h2 id="resume-h" class="app-sec__title">Pick up where you left off</h2>' +
              '<span class="app-sec__note">Films and episodes both resume to the minute</span>' +
            '</div>' +
            (resume + shows || '<p class="u-text-sm as-muted">Nothing paused. Start something and it will show up here.</p>') +
          '</section>' +
          '<section class="as-card" aria-labelledby="top-h">' +
            '<h2 id="top-h" class="app-sec__title u-mb-4">Watched most</h2>' +
            (top || '<p class="u-text-sm as-muted">Nothing watched twice yet.</p>') +
          '</section>' +
        '</div>' +
        '<div class="app-stack" style="display:flex;flex-direction:column">' +
          '<section class="as-card" aria-labelledby="time-h">' +
            '<h2 id="time-h" class="app-sec__title u-mb-4">Your watch time</h2>' +
            timeCard +
            '<div class="as-note u-mt-4 u-text-xs">' + M.icon('info') +
              '<span>Watching pays <strong>' + esc(M.moneyFull(M.ECON.WATCH_HOUR_EARN)) + ' per completed hour</strong>, ' +
              'and “completed” is not a style choice: money is floored to whole dollars, so spreading an hourly rate ' +
              'across a 30-second tick floors to zero every time and would pay nobody anything.</span></div>' +
          '</section>' +
          '<section class="as-card" aria-labelledby="how-h">' +
            '<h2 id="how-h" class="app-sec__title u-mb-4">Joining a screening</h2>' +
            '<p class="u-text-sm as-muted">Starting a screening, choosing what plays and getting your link all happen ' +
              'in Discord. The link is single-use and bound to you, and the gate that checks it on every segment of the ' +
              'stream is the same thing that measures your time and pays you for it — which is why it cannot be handed ' +
              'out by a web page that is not watching.</p>' +
          '</section>' +
        '</div>' +
      '</div>';

    M.mountIcons(host);
    A.mount(host);
  });
})();
</script>
